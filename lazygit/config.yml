# ==============================================================================
# Lazygit Configuration - Solarized Osaka Theme
# ==============================================================================

gui:
  nerdFontsVersion: "3"
  border: "rounded"
  showFileIcons: true
  showBottomLine: true
  theme:
    activeBorderColor:
      - "#268bd3"
      - "bold"
    inactiveBorderColor:
      - "#063540"
    searchingActiveBorderColor:
      - "#29a298"
      - "bold"
    optionsTextColor:
      - "#268bd3"
    selectedLineBgColor:
      - "#002c38"
    cherryPickedCommitFgColor:
      - "#29a298"
    cherryPickedCommitBgColor:
      - "#063540"
    markedBaseCommitFgColor:
      - "#268bd3"
    markedBaseCommitBgColor:
      - "#b28500"
    unstagedChangesColor:
      - "#db302d"
    defaultFgColor:
      - "#839395"
git:
  diffRenderers:
    - colorArg: always
      command: bat --paging=never --style=plain --theme="Solarized (dark)"
