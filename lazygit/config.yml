# ==============================================================================
# Lazygit Configuration - Rosé Pine Theme
# ==============================================================================

gui:
  nerdFontsVersion: "3"
  border: "rounded"
  showFileIcons: true
  showBottomLine: true
  theme:
    activeBorderColor:
      - "#ebbcba"
      - "bold"
    inactiveBorderColor:
      - "#403d52"
    searchingActiveBorderColor:
      - "#eb6f92"
      - "bold"
    optionsTextColor:
      - "#9ccfd8"
    selectedLineBgColor:
      - "#26233a"
    cherryPickedCommitFgColor:
      - "#9ccfd8"
    cherryPickedCommitBgColor:
      - "#ebbcba"
    markedBaseCommitFgColor:
      - "#31748f"
    markedBaseCommitBgColor:
      - "#f6c177"
    unstagedChangesColor:
      - "#eb6f92"
    defaultFgColor:
      - "#e0def4"

git:
  paging:
    colorArg: always
    pager: bat --paging=never --style=plain --theme="Rose-Pine"
