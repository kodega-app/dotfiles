# ==============================================================================
# Kitty Terminal Configuration
# Developer Workflow & Aesthetic Setup (Catppuccin Mocha Theme)
# ==============================================================================

# ------------------------------------------------------------------------------
# Fonts
# ------------------------------------------------------------------------------
font_family      JetBrainsMonoNL NFM
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0
adjust_line_height  115%
adjust_column_width 100%
disable_ligatures   cursor

# ------------------------------------------------------------------------------
# Color Scheme & Theme (Supports Light / Dark Dynamic Switching)
# ------------------------------------------------------------------------------
include current-theme.conf

# Transparency Settings
background_opacity         0.90
dynamic_background_opacity yes
draw_minimal_borders       yes
window_border_width        1.0pt

# ------------------------------------------------------------------------------
# Window Layout & Appearance
# ------------------------------------------------------------------------------

remember_window_size  yes
initial_window_width  1200
initial_window_height 750
window_padding_width  12 16
hide_window_decorations yes
confirm_os_window_close 0
enabled_layouts splits,stack,tall,fat,grid

# ------------------------------------------------------------------------------
# Tab Bar Configuration
# ------------------------------------------------------------------------------
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "  {index}: {title}  "


# ------------------------------------------------------------------------------
# Mouse & URL Handling
# ------------------------------------------------------------------------------
mouse_hide_wait 2.0
detect_urls yes
url_style curly
open_url_with default
copy_on_select yes
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0

# ------------------------------------------------------------------------------
# Performance & Bell Settings
# ------------------------------------------------------------------------------
repaint_delay 8
input_delay 2
sync_to_monitor yes
enable_audio_bell no
visual_bell_duration 0.0

# ------------------------------------------------------------------------------
# Terminal & Shell Integration
# ------------------------------------------------------------------------------
scrollback_lines 20000
allow_remote_control yes
listen_on unix:@mykitty
shell_integration enabled

# ------------------------------------------------------------------------------
# Keybindings
# ------------------------------------------------------------------------------
clear_all_shortcuts no

# Tab Management
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# Window Management (Splits & Navigation)
map ctrl+shift+enter launch --cwd=current --type=os-window
map alt+enter launch --cwd=current --type=window
map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+s launch --location=hsplit --cwd=current
map ctrl+shift+w close_window
map ctrl+shift+z toggle_layout stack
map ctrl+shift+l next_layout

# Window Focus Navigation
map ctrl+shift+left_bracket neighboring_window left
map ctrl+shift+right_bracket neighboring_window right

# Font Resizing
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Scrollback Navigation & Search
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+backspace combine : clear_terminal scrollback active : send_text normal,application \x0c

# Configuration Reload & Theme Toggle
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 combine : launch --type=background /home/kode/dotfiles/scripts/theme-manager.sh toggle


