# ==============================================================================
# Kitty Terminal Configuration
# Developer Workflow & Aesthetic Setup (TokyoNight Theme)
# ==============================================================================

# ------------------------------------------------------------------------------
# Fonts
# ------------------------------------------------------------------------------
# font_family  JetBrainsMonoNL NFM
font_family  JetBrainsMono NF
font_size 13
adjust_line_height  110%
adjust_column_width 100%
disable_ligatures never

# ------------------------------------------------------------------------------
# Solarized Osaka Dark Color Scheme
# ------------------------------------------------------------------------------
background #001419
foreground #839395
selection_background #002c38
selection_foreground #839395
url_color #29a298
cursor #839395
cursor_text_color #001419

# Transparency Settings
background_opacity 0.85
dynamic_background_opacity yes

# Kitty Window Border Colors
active_border_color   #268bd3
inactive_border_color #002c38
bell_border_color     #b28500

# Tab Bar Colors
active_tab_background   #29a298
active_tab_foreground   #ffffff
active_tab_font_style   bold
inactive_tab_background #002c38
inactive_tab_foreground #637981
inactive_tab_font_style normal
tab_bar_background      #001014

# Standard ANSI Colors (Solarized Osaka Dark)
color0 #001014
color1 #db302d
color2 #849900
color3 #b28500
color4 #268bd3
color5 #d23681
color6 #29a298
color7 #839395

# Bright ANSI Colors
color8  #576d74
color9  #db302d
color10 #849900
color11 #b28500
color12 #268bd3
color13 #d23681
color14 #29a298
color15 #839395

# Extended Colors
color16 #c94c16
color17 #f55350

mark1_foreground #001419
mark1_background #268bd3
mark2_foreground #001419
mark2_background #d23681
mark3_foreground #001419
mark3_background #29a298

# ------------------------------------------------------------------------------
# Window Layout & Appearance
# ------------------------------------------------------------------------------
remember_window_size  yes
initial_window_width  1200
initial_window_height 750
window_padding_width  10
hide_window_decorations no
confirm_os_window_close 0
enabled_layouts splits,stack,tall,fat,grid

# ------------------------------------------------------------------------------
# Tab Bar Configuration
# ------------------------------------------------------------------------------
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# ------------------------------------------------------------------------------
# Performance & Bell Settings
# ------------------------------------------------------------------------------
repaint_delay 10
input_delay 3
sync_to_monitor yes
enable_audio_bell no
visual_bell_duration 0.0

# ------------------------------------------------------------------------------
# Terminal & Shell Integration
# ------------------------------------------------------------------------------
term xterm-256color
scrollback_lines 10000
allow_remote_control yes
listen_on unix:@mykitty
copy_on_select yes

# ------------------------------------------------------------------------------
# Keybindings
# ------------------------------------------------------------------------------
clear_all_shortcuts no

# Tab Management
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Window Management (Splits)
map ctrl+shift+enter launch --cwd=current --type=os-window
map alt+enter launch --cwd=current --type=window
map ctrl+shift+w close_window

# Font Resizing
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Scrollback Navigation
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
