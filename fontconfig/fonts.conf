<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>~/.local/share/fonts</dir>
  <dir>~/.fonts</dir>

  <!-- Alias "Geist Mono" to "GeistMono Nerd Font" -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Geist Mono</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>

  <!-- Alias "Geist Mono Nerd Font" to "GeistMono Nerd Font" -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Geist Mono Nerd Font</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>GeistMono Nerd Font</string>
    </edit>
  </match>
</fontconfig>
