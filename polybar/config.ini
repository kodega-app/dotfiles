[colors]
background = #1e1e2e
foreground = #cdd6f4
primary = #89b4fa
secondary = #f38ba8
alert = #fab387
disabled = #6c7086

[bar/main]
width = 100%
height = 24pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 4pt
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}
font-0 = "GeistMono Nerd Font:size=10;2"

modules-left = i3
modules-right = pulseaudio bluetooth cpu memory wlan date tray

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
override-redirect = false

[module/i3]
type = internal/i3
show-urgent = true
strip-ws-numbers = true
enable-click = true
enable-scroll = false
wrapping-scroll = false

format = <label-state> <label-mode>

label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %used%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
label-connected = %essid%
format-disconnected =

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M
label = %date%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}

format-muted = <label-muted>
label-muted = 󰝟 muted
label-muted-foreground = ${colors.disabled}

click-right = kitty -e alsamixer

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 2
click-left = blueman-manager
click-right = ~/.config/polybar/scripts/bluetooth.sh --toggle

[module/tray]
type = internal/tray
format-margin = 4px
tray-spacing = 8px
tray-size = 65%

