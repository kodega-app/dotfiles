# ==============================================================================
# Starship Prompt Configuration
# Minimal, Clean & Professional Developer Prompt (Catppuccin Mocha Palette)
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os$directory$git_branch$git_status$c$golang$nodejs$python$rust$terraform$aws$docker_context$cmd_duration
$character"""

# Insert a blank line between prompts for visual breathing room
add_newline = true

# ------------------------------------------------------------------------------
# Character (Prompt Symbol)
# ------------------------------------------------------------------------------
[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# ------------------------------------------------------------------------------
# Directory
# ------------------------------------------------------------------------------
[directory]
style = "bold blue"
read_only = " 󰌾"
read_only_style = "bold red"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

# ------------------------------------------------------------------------------
# Git Integration
# ------------------------------------------------------------------------------
[git_branch]
symbol = "󰘬 "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ------------------------------------------------------------------------------
# Programming Languages & Tools (Clean, Context-Aware)
# ------------------------------------------------------------------------------
[golang]
symbol = "󰟓 "
style = "bold cyan"
format = "via [$symbol($version)]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "via [${symbol}${pyenv_prefix}(${version})]($style) "

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "via [$symbol($version)]($style) "

[rust]
symbol = "󱘗 "
style = "bold red"
format = "via [$symbol($version)]($style) "

[c]
symbol = " "
style = "bold blue"
format = "via [$symbol($version)]($style) "

[terraform]
symbol = "󱁢 "
style = "bold purple"
format = "via [$symbol$workspace]($style) "

[docker_context]
symbol = "󰡨 "
style = "bold cyan"
format = "via [$symbol$context]($style) "

# ------------------------------------------------------------------------------
# Command Duration
# ------------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000
style = "bold bright-black"
format = "took [$duration]($style) "

# ------------------------------------------------------------------------------
# Disabled Modules (Minimalism)
# ------------------------------------------------------------------------------
[package]
disabled = true

[aws]
symbol = "󰸏 "
style = "bold yellow"
format = "on [$symbol($profile )(\\($region\\) )]($style)"
disabled = false

[gcloud]
disabled = true
