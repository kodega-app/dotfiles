# ============================================================================
# KODEGA - Minimal Tmux Configuration
# DevOps & Infrastructure Engineer
# ============================================================================

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Display tmux messages for 4 seconds
set -g display-time 4000

# Refresh status more often
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Aggressive resize
setw -g aggressive-resize on

# Don't rename windows automatically
set -g allow-rename off

# ============================================================================
# KEY BINDINGS
# ============================================================================

# Change prefix from 'Ctrl-b' to 'Ctrl-a'
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes using | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch panes using vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# Copy mode vim bindings
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ============================================================================
# STATUS BAR - Minimal Catppuccin Mocha Theme
# ============================================================================

# Position - Top for clean look
set -g status-position top

# Status bar styling - Minimal and clean
set -g status-style bg="#1e1e2e",fg="#cdd6f4"
set -g status-justify left

# Left side: Simple session indicator
set -g status-left-length 20
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#45475a]│ "

# Right side: Minimal date & time
set -g status-right-length 40
set -g status-right "#[fg=#45475a]│ #[fg=#f9e2af]%d %b #[fg=#45475a]│ #[fg=#a6e3a1]%H:%M "

# Window status - Clean and minimal
setw -g window-status-format "#[fg=#585b70] #I #W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I #W "
setw -g window-status-separator ""

# Pane borders - Subtle
set -g pane-border-style fg="#45475a"
set -g pane-active-border-style fg="#89b4fa"

# Message style - Clean
set -g message-style bg="#313244",fg="#f9e2af"
set -g message-command-style bg="#313244",fg="#f9e2af"

# Mode style (copy mode, etc)
set -g mode-style bg="#585b70",fg="#cdd6f4"

# ============================================================================
# PANE SETTINGS
# ============================================================================

# Pane number display - Minimal colors
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#585b70"

# Clock mode - Clean
setw -g clock-mode-colour "#89b4fa"
setw -g clock-mode-style 24

# ============================================================================
# PLUGINS (Optional - using TPM)
# ============================================================================

# List of plugins
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep this line at the very bottom)
# run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# NOTES
# ============================================================================
# Prefix: Ctrl-a
# Split vertical: Ctrl-a |
# Split horizontal: Ctrl-a -
# Switch panes: Alt + Arrow keys (no prefix!)
# Resize panes: Ctrl-a H/J/K/L
# New window: Ctrl-a c
# Switch windows: Shift + Arrow keys
# Copy mode: Ctrl-a [
# Reload config: Ctrl-a r

