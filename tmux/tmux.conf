# ==============================================================================
# Tmux Configuration - Terminal-focused Software Development
# Matches Solarized Osaka theme & integrates with Neovim & Kitty
# ==============================================================================

# ------------------------------------------------------------------------------
# General Settings
# ------------------------------------------------------------------------------
# Set prefix to Ctrl-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable 24-bit True Color & RGB support for xterm-256color and Kitty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB"
set -as terminal-overrides ",xterm-256color:Tc,xterm-kitty:Tc"

# Undercurl & Underline color support (Solarized Osaka requirement)
set -as terminal-overrides ',*:Smulx=\E[4%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Enable OSC 52 clipboard passthrough
set -s set-clipboard on

# Reduce escape delay for vim responsiveness
set -s escape-time 0
set -g focus-events on

# History limit
set -g history-limit 50000

# Display message time (ms) & status interval
set -g display-time 3000
set -g status-interval 5

# Enable mouse mode
set -g mouse on

# Start window and pane indices at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ------------------------------------------------------------------------------
# Keybindings
# ------------------------------------------------------------------------------
# Easy configuration reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message " Config reloaded!"

# Split panes using | and - or \ and _ (preserving current path)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane toggle maximize / zoom
bind m resize-pane -Z

# Toggle pane synchronization (type across all panes simultaneously)
bind y setw synchronize-panes \; display-message " Synchronize panes: #{?pane_synchronized,ON,OFF}"

# Window swap shortcuts
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Pane resizing with Vim keys (capital)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Seamless Vim-Tmux navigation (vim-tmux-navigator plugin compatibility)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ (\\^|\\/)g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# ------------------------------------------------------------------------------
# Vi Copy Mode Settings (Wayland wl-copy & X11 xclip clipboard)
# ------------------------------------------------------------------------------
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || true"
unbind -T copy-mode-vi MouseDragEnd1Pane

# ------------------------------------------------------------------------------
# Catppuccin Theme & Status Bar (Dynamic System Light / Dark Detection)
# ------------------------------------------------------------------------------
set -g status-position top
set -g status "on"
set -g status-justify "left"
set -g status-left-length 100
set -g status-right-length 100

# Theme toggle shortcut
bind T run-shell "/home/kode/dotfiles/scripts/theme-manager.sh toggle"

# Load theme based on system dark/light preference
if-shell '[ "$(/home/kode/dotfiles/scripts/theme-manager.sh system-theme)" = "light" ] || ([ -f ~/.cache/theme ] && [ "$(cat ~/.cache/theme)" = "light" ])' \
    'source-file ~/.config/tmux/themes/latte.conf' \
    'source-file ~/.config/tmux/themes/mocha.conf'





