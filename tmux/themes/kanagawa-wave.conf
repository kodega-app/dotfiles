# ==============================================================================
# Kanagawa Wave (Dark) Theme for Tmux
# Based on rebelot/kanagawa.nvim — Wave variant
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#7e9cd8,bg=#2d4f67,bold"

# Command / Message Line
set -g message-style "fg=#7e9cd8,bg=#2d4f67,bold"
set -g message-command-style "fg=#7e9cd8,bg=#2d4f67"

# Panes
set -g pane-border-style "fg=#2d4f67"
set -g pane-active-border-style "fg=#7e9cd8"

# Status Bar (Transparent & Smooth)
set -g status-style "fg=#dcd7ba,bg=default"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#1f1f28,bg=#7e9cd8,bold]  #S #[fg=#7e9cd8,bg=default,nobold] "
set -g status-right "#[fg=#2d4f67,bg=default,nobold]#[fg=#dcd7ba,bg=#2d4f67] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#6a9589,bg=#2d4f67,nobold]#[fg=#1f1f28,bg=#6a9589,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#727169,bg=default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#727169,bg=default"
setw -g window-status-format "#[fg=#727169,bg=default] #I  #W #F "
setw -g window-status-current-format "#[fg=#7e9cd8,bg=#2d4f67,bold] #I  #W #F #[default]"
