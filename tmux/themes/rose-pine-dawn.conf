# ==============================================================================
# Rosé Pine Dawn Theme for Tmux (Smooth & Transparent)
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#286983,bg=#f2e9e1,bold"

# Command / Message Line
set -g message-style "fg=#286983,bg=#f2e9e1,bold"
set -g message-command-style "fg=#286983,bg=#f2e9e1"

# Panes
set -g pane-border-style "fg=#dfdad9"
set -g pane-active-border-style "fg=#286983"

# Status Bar (Transparent & Smooth)
set -g status-style "fg=#797593,bg=default"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#faf4ed,bg=#286983,bold]  #S #[fg=#286983,bg=default,nobold] "
set -g status-right "#[fg=#f2e9e1,bg=default,nobold]#[fg=#797593,bg=#f2e9e1] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#d7827e,bg=#f2e9e1,nobold]#[fg=#faf4ed,bg=#d7827e,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#9893a5,bg=default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#9893a5,bg=default"
setw -g window-status-format "#[fg=#9893a5,bg=default] #I  #W #F "
setw -g window-status-current-format "#[fg=#286983,bg=#f2e9e1,bold] #I  #W #F #[default]"
