# ==============================================================================
# Nord Theme for Tmux (Dark - Polar Night & Frost)
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#88c0d0,bg=#3b4252,bold"

# Command / Message Line
set -g message-style "fg=#88c0d0,bg=#2e3440,bold"
set -g message-command-style "fg=#88c0d0,bg=#2e3440"

# Panes
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"

# Status Bar (Transparent & Smooth)
set -g status-style "fg=#d8dee9,bg=default"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold]  #S #[fg=#88c0d0,bg=default,nobold] "
set -g status-right "#[fg=#3b4252,bg=default,nobold]#[fg=#d8dee9,bg=#3b4252] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#88c0d0,bg=#3b4252,nobold]#[fg=#2e3440,bg=#88c0d0,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#81a1c1,bg=default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#81a1c1,bg=default"
setw -g window-status-format "#[fg=#81a1c1,bg=default] #I  #W #F "
setw -g window-status-current-format "#[fg=#88c0d0,bg=#3b4252,bold] #I  #W #F #[default]"
