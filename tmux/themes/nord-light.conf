# ==============================================================================
# Nord Snow Storm Theme for Tmux (Light)
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#5e81ac,bg=#d8dee9,bold"

# Command / Message Line
set -g message-style "fg=#5e81ac,bg=#e5e9f0,bold"
set -g message-command-style "fg=#5e81ac,bg=#e5e9f0"

# Panes
set -g pane-border-style "fg=#d8dee9"
set -g pane-active-border-style "fg=#5e81ac"

# Status Bar
set -g status-style "fg=#2e3440,bg=#e5e9f0"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#eceff4,bg=#5e81ac,bold]  #S #[fg=#5e81ac,bg=#e5e9f0,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#d8dee9,bg=#e5e9f0,nobold,nounderscore,noitalics]#[fg=#2e3440,bg=#d8dee9] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#5e81ac,bg=#d8dee9,nobold,nounderscore,noitalics]#[fg=#eceff4,bg=#5e81ac,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#4c566a,bg=#e5e9f0"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#4c566a,bg=#e5e9f0"
setw -g window-status-format "#[fg=#e5e9f0,bg=#e5e9f0,nobold,nounderscore,noitalics]#[fg=#4c566a,bg=#e5e9f0] #I  #W #F #[fg=#e5e9f0,bg=#e5e9f0,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#e5e9f0,bg=#d8dee9,nobold,nounderscore,noitalics]#[fg=#5e81ac,bg=#d8dee9,bold] #I  #W #F #[fg=#d8dee9,bg=#e5e9f0,nobold,nounderscore,noitalics]"
