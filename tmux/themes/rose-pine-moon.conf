# ==============================================================================
# Rosé Pine Moon Theme for Tmux (Smooth & Transparent)
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#ea9a97,bg=#393552,bold"

# Command / Message Line
set -g message-style "fg=#ea9a97,bg=#393552,bold"
set -g message-command-style "fg=#ea9a97,bg=#393552"

# Panes
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#3e8fb0"

# Status Bar (Transparent & Smooth)
set -g status-style "fg=#908caa,bg=default"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#232136,bg=#3e8fb0,bold]  #S #[fg=#3e8fb0,bg=default,nobold] "
set -g status-right "#[fg=#393552,bg=default,nobold]#[fg=#908caa,bg=#393552] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#ea9a97,bg=#393552,nobold]#[fg=#232136,bg=#ea9a97,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#6e6a86,bg=default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#6e6a86,bg=default"
setw -g window-status-format "#[fg=#6e6a86,bg=default] #I  #W #F "
setw -g window-status-current-format "#[fg=#ea9a97,bg=#393552,bold] #I  #W #F #[default]"
