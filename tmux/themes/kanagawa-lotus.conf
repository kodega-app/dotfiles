# ==============================================================================
# Kanagawa Lotus (Light) Theme for Tmux
# Based on rebelot/kanagawa.nvim — Lotus variant
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#4d699b,bg=#c9cbd1,bold"

# Command / Message Line
set -g message-style "fg=#4d699b,bg=#c9cbd1,bold"
set -g message-command-style "fg=#4d699b,bg=#c9cbd1"

# Panes
set -g pane-border-style "fg=#c9cbd1"
set -g pane-active-border-style "fg=#4d699b"

# Status Bar (Transparent & Smooth)
set -g status-style "fg=#545464,bg=default"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#f2ecbc,bg=#4d699b,bold]  #S #[fg=#4d699b,bg=default,nobold] "
set -g status-right "#[fg=#c9cbd1,bg=default,nobold]#[fg=#545464,bg=#c9cbd1] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#597b75,bg=#c9cbd1,nobold]#[fg=#f2ecbc,bg=#597b75,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#716e61,bg=default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#716e61,bg=default"
setw -g window-status-format "#[fg=#716e61,bg=default] #I  #W #F "
setw -g window-status-current-format "#[fg=#4d699b,bg=#c9cbd1,bold] #I  #W #F #[default]"
