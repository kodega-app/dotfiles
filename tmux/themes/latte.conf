# ==============================================================================
# Catppuccin Latte Theme for Tmux (Light)
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#1e66f5,bg=#ccd0da,bold"

# Command / Message Line
set -g message-style "fg=#1e66f5,bg=#e6e9ef,bold"
set -g message-command-style "fg=#1e66f5,bg=#e6e9ef"

# Panes
set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#1e66f5"

# Status Bar
set -g status-style "fg=#4c4f69,bg=#e6e9ef"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#eff1f5,bg=#1e66f5,bold]  #S #[fg=#1e66f5,bg=#e6e9ef,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#ccd0da,bg=#e6e9ef,nobold,nounderscore,noitalics]#[fg=#4c4f69,bg=#ccd0da] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#1e66f5,bg=#ccd0da,nobold,nounderscore,noitalics]#[fg=#eff1f5,bg=#1e66f5,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#6c6f85,bg=#e6e9ef"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#6c6f85,bg=#e6e9ef"
setw -g window-status-format "#[fg=#e6e9ef,bg=#e6e9ef,nobold,nounderscore,noitalics]#[fg=#6c6f85,bg=#e6e9ef] #I  #W #F #[fg=#e6e9ef,bg=#e6e9ef,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#e6e9ef,bg=#ccd0da,nobold,nounderscore,noitalics]#[fg=#1e66f5,bg=#ccd0da,bold] #I  #W #F #[fg=#ccd0da,bg=#e6e9ef,nobold,nounderscore,noitalics]"
