# ==============================================================================
# Solarized Osaka Theme for Tmux (Smooth & Transparent)
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#268bd3,bg=#063540,bold"

# Command / Message Line
set -g message-style "fg=#268bd3,bg=#063540,bold"
set -g message-command-style "fg=#268bd3,bg=#063540"

# Panes
set -g pane-border-style "fg=#063540"
set -g pane-active-border-style "fg=#268bd3"

# Status Bar (Transparent & Smooth)
set -g status-style "fg=#839395,bg=default"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#001419,bg=#268bd3,bold]  #S #[fg=#268bd3,bg=default,nobold] "
set -g status-right "#[fg=#063540,bg=default,nobold]#[fg=#839395,bg=#063540] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#29a298,bg=#063540,nobold]#[fg=#001419,bg=#29a298,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#576d74,bg=default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#576d74,bg=default"
setw -g window-status-format "#[fg=#576d74,bg=default] #I  #W #F "
setw -g window-status-current-format "#[fg=#268bd3,bg=#063540,bold] #I  #W #F #[default]"
