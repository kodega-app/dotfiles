# ==============================================================================
# Solarized Osaka Light Theme for Tmux (Smooth & Transparent)
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#268bd3,bg=#ede7d3,bold"

# Command / Message Line
set -g message-style "fg=#268bd3,bg=#ede7d3,bold"
set -g message-command-style "fg=#268bd3,bg=#ede7d3"

# Panes
set -g pane-border-style "fg=#ede7d3"
set -g pane-active-border-style "fg=#268bd3"

# Status Bar (Transparent & Smooth)
set -g status-style "fg=#576d74,bg=default"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#fdf5e2,bg=#268bd3,bold]  #S #[fg=#268bd3,bg=default,nobold] "
set -g status-right "#[fg=#ede7d3,bg=default,nobold]#[fg=#576d74,bg=#ede7d3] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#29a298,bg=#ede7d3,nobold]#[fg=#fdf5e2,bg=#29a298,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#9eabac,bg=default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#9eabac,bg=default"
setw -g window-status-format "#[fg=#9eabac,bg=default] #I  #W #F "
setw -g window-status-current-format "#[fg=#268bd3,bg=#ede7d3,bold] #I  #W #F #[default]"
