# ==============================================================================
# Rosé Pine Theme for Tmux (Smooth & Transparent)
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#ebbcba,bg=#26233a,bold"

# Command / Message Line
set -g message-style "fg=#ebbcba,bg=#26233a,bold"
set -g message-command-style "fg=#ebbcba,bg=#26233a"

# Panes
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#31748f"

# Status Bar (Transparent & Smooth)
set -g status-style "fg=#908caa,bg=default"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#191724,bg=#31748f,bold]  #S #[fg=#31748f,bg=default,nobold] "
set -g status-right "#[fg=#26233a,bg=default,nobold]#[fg=#908caa,bg=#26233a] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#ebbcba,bg=#26233a,nobold]#[fg=#191724,bg=#ebbcba,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#6e6a86,bg=default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#6e6a86,bg=default"
setw -g window-status-format "#[fg=#6e6a86,bg=default] #I  #W #F "
setw -g window-status-current-format "#[fg=#ebbcba,bg=#26233a,bold] #I  #W #F #[default]"
