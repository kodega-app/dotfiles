# ==============================================================================
# Catppuccin Mocha Theme for Tmux (Dark)
# ==============================================================================

# Mode & Selection
set -g mode-style "fg=#89b4fa,bg=#313244,bold"

# Command / Message Line
set -g message-style "fg=#89b4fa,bg=#181825,bold"
set -g message-command-style "fg=#89b4fa,bg=#181825"

# Panes
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Status Bar
set -g status-style "fg=#cdd6f4,bg=#181825"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#11111b,bg=#89b4fa,bold]  #S #[fg=#89b4fa,bg=#181825,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#313244,bg=#181825,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#313244] 󰅐 %H:%M  󰃭 %Y-%m-%d #[fg=#89b4fa,bg=#313244,nobold,nounderscore,noitalics]#[fg=#11111b,bg=#89b4fa,bold] 󰍹 #H "

# Window Status
setw -g window-status-activity-style "underscore,fg=#a6adc8,bg=#181825"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a6adc8,bg=#181825"
setw -g window-status-format "#[fg=#181825,bg=#181825,nobold,nounderscore,noitalics]#[fg=#a6adc8,bg=#181825] #I  #W #F #[fg=#181825,bg=#181825,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#181825,bg=#313244,nobold,nounderscore,noitalics]#[fg=#89b4fa,bg=#313244,bold] #I  #W #F #[fg=#313244,bg=#181825,nobold,nounderscore,noitalics]"
